# Builds the downloadable game and attaches it to a GitHub Release.
# Push a version tag to publish:  git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          cat > notes.md <<'NOTES'
          **Quick play:** download `battle-cards.html` and double-click it. Tutorial, bots and deck builder work offline in any modern browser.

          **Full game (online play):** download `battle-cards.zip`, unzip it and run *Start Battle Cards* for your system (Windows `.bat`, Mac `.command`, Linux `start.sh`). Online play needs [Node.js](https://nodejs.org) 18+; without it the launcher opens the offline version.
          NOTES
          gh release create "$TAG" dist/battle-cards.html dist/battle-cards.zip \
            --title "Battle Cards $TAG" --notes-file notes.md --target "$GITHUB_SHA"
