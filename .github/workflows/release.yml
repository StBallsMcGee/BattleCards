# Builds the downloadable game and attaches it to the GitHub Release for the version in package.json.
# Every push to main refreshes that release's files; bump "version" in package.json to start a new release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          cat > notes.md <<'NOTES'
          **Quick play:** download `battle-cards.html` and double-click it. Tutorial, bots and deck builder work offline in any modern browser.

          **Play a friend:** both open the game, choose *Play Online*; one presses *Create Room* and sends the 5-letter code, the other types it and presses *Join*. No server needed.

          **On a phone:** open the phone version at https://stballsmcgee.github.io/battlecards/mobile/ and use *Add to Home Screen* to install it (it then works offline). Or download `battle-cards-mobile.html`.

          **Your own server (optional):** download `battle-cards.zip`, unzip it and run *Start Battle Cards* for your system (Windows `.bat`, Mac `.command`, Linux `start.sh`). Needs [Node.js](https://nodejs.org) 18+; without it the launcher opens the offline version.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/battle-cards.html dist/battle-cards-mobile.html dist/battle-cards.zip --clobber
          else
            gh release create "$TAG" dist/battle-cards.html dist/battle-cards-mobile.html dist/battle-cards.zip \
              --title "Battle Cards $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
